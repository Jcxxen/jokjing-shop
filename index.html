<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ร้านจกจิ๊ง - บริการดิจิทัลพรีเมียม</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 0;
      color: #333;
    }
    header {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: white;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    header h1 {
      margin: 0;
      font-size: 28px;
    }
    header p {
      margin: 5px 0 0 0;
      font-size: 14px;
      opacity: 0.9;
    }
    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 0 15px;
    }
    #list {
      display: grid;
      gap: 15px;
    }
    .product-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s;
    }
    .product-card:hover {
      transform: translateY(-2px);
    }
    .product-info h3 {
      margin: 0 0 8px 0;
      font-size: 18px;
      color: #1f2937;
    }
    .product-info .price {
      color: #ef4444;
      font-weight: bold;
      font-size: 16px;
      margin: 0;
    }
    .buy-btn {
      background: #22c55e;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      transition: background 0.2s;
    }
    .buy-btn:hover {
      background: #16a34a;
    }
    .loading {
      text-align: center;
      color: #6b7280;
      padding: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>ร้านจกจิ๊ง</h1>
    <p>แหล่งรวมบริการสตรีมมิ่งและไอเทมดิจิทัลราคาประหยัด</p>
  </header>

  <div class="container">
    <div id="list">
      <div class="loading">กำลังโหลดสินค้า...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA16VXbSopR3NTBMD-SU-RCgJV5zLPkkBU",
      authDomain: "jokjing-shop.firebaseapp.com",
      projectId: "jokjing-shop",
      storageBucket: "jokjing-shop.firebasestorage.app",
      messagingSenderId: "559683140548",
      appId: "1:559683140548:web:f540aa77108c5a171cc291"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadProducts() {
      const listDiv = document.getElementById("list");
      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        if (querySnapshot.empty) {
          listDiv.innerHTML = "<div class='loading'>ยังไม่มีสินค้าในระบบ</div>";
          return;
        }
        listDiv.innerHTML = "";
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          // ลิงก์ปุ่มสั่งซื้อ สามารถเปลี่ยนเป็นลิงก์ LINE OA ของตัวเองได้เลยครับ
          const lineMessage = encodeURIComponent(`สนใจสั่งซื้อ ${data.name || 'สินค้า'} ราคา ${data.price || '-'} บาทครับ`);
          const lineLink = `https://line.me/R/ti/p/@781wfctk`; // แทนที่ด้วยลิงก์ LINE OA ของคุณ

          listDiv.innerHTML += `
            <div class="product-card">
              <div class="product-info">
                <h3>${data.name || 'สินค้าพรีเมียม'}</h3>
                <p class="price">฿${data.price || '-'}</p>
              </div>
              <a href="${lineLink}" target="_blank" class="buy-btn">สั่งซื้อ</a>
            </div>
          `;
        });
      } catch (error) {
        console.error(error);
        listDiv.innerHTML = "<div class='loading'>ไม่สามารถโหลดข้อมูลได้</div>";
      }
    }

    loadProducts();
  </script>

</body>
</html>
