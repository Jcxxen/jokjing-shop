<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ร้านจกจิ๊ง</title>
</head>
<body>
  <h1>สินค้า</h1>
  <div id="list">กำลังโหลด...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA16VXbSopR3NTBMD-SU-RCgJV5zLPkkBU",
      authDomain: "jokjing-shop.firebaseapp.com",
      projectId: "jokjing-shop",
      storageBucket: "jokjing-shop.firebasestorage.app",
      messagingSenderId: "559683140548",
      appId: "1:559683140548:web:f540aa77108c5a171cc291"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function load() {
      const listDiv = document.getElementById("list");
      try {
        // วิ่งเข้าไปดึงข้อมูลตามโครงสร้างที่อยู่ใน Firebase ตอนนี้ครับ
        const snap = await getDocs(collection(db, "products", "T16hfYCr1a3SV4uyIXep", "products"));
        listDiv.innerHTML = "";
        snap.forEach(doc => {
          const d = doc.data();
          listDiv.innerHTML += `<p>${d.name || '-'} : ${d.price || '-'} บาท</p>`;
        });
      } catch (err) {
        listDiv.innerHTML = "เกิดข้อผิดพลาด: " + err.message;
      }
    }
    load();
  </script>
</body>
</html>
