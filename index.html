<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">ร้านจกจิ๊ง - บริการดิจิทัลพรีเมียม</title>
  <!-- Cropper.js CSS สำหรับระบบครอปรูปตามกรอบ -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --primary-color: #4f46e5;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-color); color: var(--text-color);
      margin: 0; padding: 0; padding-bottom: 90px;
    }

    .navbar {
      background: #4f46e5; color: white; padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 90;
    }
    .nav-left { display: flex; align-items: center; gap: 12px; }
    .icon-btn { background: none; border: none; color: white; font-size: 22px; cursor: pointer; }
    .brand-container { display: flex; align-items: center; gap: 10px; }
    .brand-logo {
      width: 38px; height: 38px; border-radius: 50%; background: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; color: #4f46e5; font-size: 16px; overflow: hidden;
    }
    .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
    .brand-title { font-size: 18px; font-weight: bold; }

    /* ไอคอนยูสเซอร์ลอยตรงกลางขอบล่างของจอ */
    .floating-profile-btn {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: 58px; height: 58px; border-radius: 50%;
      background: #4f46e5; color: white; border: 3px solid white;
      display: flex; justify-content: center; align-items: center;
      font-size: 24px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25); z-index: 99; overflow: hidden;
    }
    .floating-profile-btn img { width: 100%; height: 100%; object-fit: cover; }

    /* Drawer Menu */
    .drawer {
      position: fixed; top: 0; left: -280px; width: 260px; height: 100%;
      background: var(--card-bg); color: var(--text-color);
      box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 100;
      transition: left 0.3s ease; display: flex; flex-direction: column;
    }
    .drawer.open { left: 0; }
    .drawer-header {
      background: #4f46e5; color: white;
      padding: 20px; font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 10px;
    }
    .drawer-menu { list-style: none; padding: 0; margin: 0; }
    .drawer-menu li a {
      display: block; padding: 15px 20px; color: var(--text-color);
      text-decoration: none; border-bottom: 1px solid var(--border-color); font-weight: 500; cursor: pointer;
    }
    .overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4); z-index: 95;
    }
    .overlay.open { display: block; }

    .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }

    /* Modal Styles */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 110;
    }
    .modal-content {
      background: var(--card-bg); color: var(--text-color); padding: 25px; border-radius: 12px;
      width: 90%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto;
    }
    .close-btn { float: right; cursor: pointer; font-size: 20px; color: #aaa; }
    .form-group { margin-bottom: 14px; position: relative; }
    .form-group label { display: block; font-size: 13px; margin-bottom: 5px; opacity: 0.8; font-weight: 600; }
    .form-group input { 
      width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; 
      font-size: 14px; background: var(--bg-color); color: var(--text-color); 
    }
    
    .forgot-link-sm {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 11px; color: #64748b; margin-top: 4px; cursor: pointer; text-decoration: underline;
    }

    .btn-submit { width: 100%; background: #22c55e; color: white; border: none; padding: 11px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 14px; }
    .btn-danger { width: 100%; background: #ef4444; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 13px; }
    .switch-mode { text-align: center; margin-top: 15px; font-size: 13px; color: #4f46e5; cursor: pointer; text-decoration: underline; }

    .role-badge {
      display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; margin-bottom: 12px;
    }
    .role-admin { background: #fee2e2; color: #dc2626; }
    .role-agent { background: #dbeafe; color: #2563eb; }
    .role-customer { background: #f1f5f9; color: #475569; }

    .pass-input-wrapper { position: relative; display: flex; align-items: center; }
    .pass-input-wrapper input { padding-right: 35px; }
    .toggle-eye-btn {
      position: absolute; right: 10px; background: none; border: none; cursor: pointer; font-size: 16px; opacity: 0.6;
    }

    .avatar-crop-box {
      width: 90px; height: 90px; border-radius: 50%; border: 2px dashed #4f46e5;
      margin: 10px auto; overflow: hidden; display: flex; justify-content: center; align-items: center;
      background: #f1f5f9; cursor: pointer;
    }
    .avatar-crop-box img { width: 100%; height: 100%; object-fit: cover; }

    /* หน้าต่างครอปรูป */
    #cropper-container { width: 100%; max-height: 350px; overflow: hidden; margin-bottom: 15px; }
    #image-to-crop { max-width: 100%; display: block; }

    .collapsible-btn {
      width: 100%; background: var(--bg-color); border: 1px solid var(--border-color);
      padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: left;
      display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px;
    }
    .collapsible-content { display: none; padding-top: 10px; }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <div class="navbar">
    <div class="nav-left">
      <button class="icon-btn" id="open-drawer-btn">☰</button>
      <div class="brand-container">
        <div class="brand-logo" id="nav-brand-logo-container">จก</div>
        <span class="brand-title" id="nav-brand-title">ร้านจกจิ๊ง</span>
      </div>
    </div>
  </div>

  <!-- Drawer Menu -->
  <div class="overlay" id="menu-overlay"></div>
  <div class="drawer" id="side-drawer">
    <div class="drawer-header">
      <div class="brand-logo" id="drawer-brand-logo" style="width:30px;height:30px;font-size:14px;">จก</div>
      <span id="drawer-brand-name">ร้านจกจิ๊ง Shop</span>
    </div>
    <ul class="drawer-menu">
      <li><a onclick="closeDrawer()">🏠 หน้าหลัก</a></li>
      <li><a onclick="openAdminModal(); closeDrawer();" id="admin-menu-link" style="color:#ef4444; font-weight:bold; display:none;">🛠️ แผงควบคุม (แอดมิน)</a></li>
    </ul>
  </div>

  <!-- Main Content Area -->
  <div class="container">
    <h3 style="text-align:center;">🛒 ยินดีต้อนรับสู่ร้านจกจิ๊ง</h3>
    <p style="text-align:center; color:#64748b; font-size:14px;">กดที่ไอคอนผู้ใช้ด้านล่างสุดเพื่อเข้าสู่ระบบ หรือจัดการโปรไฟล์ของคุณ</p>
  </div>

  <!-- ไอคอนยูสเซอร์ลอยอยู่ตรงกลางขอบล่างของจอ -->
  <div class="floating-profile-btn" id="floating-profile-btn">
    👤
  </div>

  <!-- Modal Auth: เข้าสู่ระบบ / สมัครสมาชิก -->
  <div class="modal" id="auth-modal">
    <div class="modal-content">
      <span class="close-btn" id="auth-modal-close">&times;</span>
      <h3 id="modal-title" style="margin-top:0;">เข้าสู่ระบบ</h3>
      <form id="auth-form">
        <div class="form-group">
          <label>ชื่อผู้ใช้ (อย่างน้อย 5 ตัวอักษร)</label>
          <input type="text" id="auth-username" required minlength="5" placeholder="กรอกชื่อผู้ใช้ 5 ตัวขึ้นไป">
        </div>
        <div class="form-group" style="margin-bottom:6px;">
          <label>รหัสผ่าน (อย่างน้อย 4 ตัวอักษร)</label>
          <input type="password" id="auth-password" required minlength="4" placeholder="กรอกรหัสผ่าน 4 ตัวขึ้นไป">
          <div>
            <span class="forgot-link-sm" id="forgot-pass-btn" onclick="forgotPassword()">🔑 ลืมรหัสผ่าน?</span>
          </div>
        </div>
        <button type="submit" class="btn-submit" id="modal-submit-btn">เข้าสู่ระบบ</button>
      </form>
      <div class="switch-mode" id="switch-mode-btn">ยังไม่มีบัญชี? สมัครสมาชิก</div>
    </div>
  </div>

  <!-- Modal Profile: จัดการโปรไฟล์ส่วนตัว -->
  <div class="modal" id="profile-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="document.getElementById('profile-modal').style.display='none'">&times;</span>
      <h3 style="margin-top:0;">👤 โปรไฟล์ส่วนตัว</h3>

      <!-- 4. รูปโปรไฟล์ -->
      <div class="form-group" style="text-align:center;">
        <label>รูปโปรไฟล์</label>
        <div class="avatar-crop-box" onclick="document.getElementById('edit-avatar-file').click()">
          <img id="avatar-preview-img" src="" alt="Avatar" style="display:none;">
          <span id="avatar-placeholder-txt" style="font-size:30px;">📷</span>
        </div>
        <input type="file" id="edit-avatar-file" accept="image/*" style="display:none;">
      </div>

      <!-- 3. สิทธิ์ของยูส -->
      <div style="text-align:center;">
        <div id="user-role-badge-container"></div>
      </div>

      <!-- 1. ชื่อผู้ใช้ -->
      <div class="form-group">
        <label>1. ชื่อผู้ใช้ (เปลี่ยนชื่อได้):</label>
        <input type="text" id="profile-username-input" minlength="5">
      </div>

      <!-- 2. รหัสผ่าน -->
      <div class="form-group">
        <label>2. รหัสผ่านปัจจุบัน:</label>
        <div class="pass-input-wrapper">
          <input type="password" id="profile-password-display" readonly value="••••••••">
          <button type="button" class="toggle-eye-btn" id="toggle-eye-btn" onclick="togglePassView()">👁️</button>
        </div>
      </div>

      <!-- 5. เปลี่ยนรหัสผ่าน 4 ตัว (เอาเลข 5 ออกแล้ว) -->
      <button class="collapsible-btn" onclick="togglePassCollapsible()">
        <span>🔑 เปลี่ยนรหัสผ่าน 4 ตัว</span>
        <span id="pass-arrow">▼</span>
      </button>
      <div class="collapsible-content" id="pass-collapsible-box">
        <form id="change-pass-form">
          <div class="form-group">
            <label>รหัสผ่านใหม่ (อย่างน้อย 4 ตัว):</label>
            <input type="password" id="new-password-input" required minlength="4" placeholder="ตั้งรหัสผ่านใหม่ 4 ตัวขึ้นไป">
          </div>
          <button type="submit" class="btn-submit" style="background:#4f46e5;">🔒 บันทึกรหัสผ่านใหม่</button>
        </form>
      </div>

      <!-- 6. บันทึกอัตโนมัติ Status -->
      <div id="auto-save-status" style="text-align:center; font-size:11px; color:#22c55e; margin-top:8px; height:15px;"></div>

      <!-- 7. ปุ่มออกจากระบบ -->
      <button class="btn-danger" onclick="logoutUser()">🚪 ออกจากระบบ</button>
    </div>
  </div>

  <!-- Modal สำหรับปรับเลื่อนครอปรูปภาพตามต้องการ -->
  <div class="modal" id="cropper-modal" style="z-index: 120;">
    <div class="modal-content" style="text-align:center;">
      <h3 style="margin-top:0;">ปรับแต่งเลือกพื้นที่รูปภาพ</h3>
      <div id="cropper-container">
        <img id="image-to-crop" src="" alt="Source">
      </div>
      <button type="button" class="btn-submit" id="crop-confirm-btn" style="background:#22c55e;">✓ ยืนยันการครอปรูป</button>
      <button type="button" class="btn-danger" style="margin-top:8px;" onclick="document.getElementById('cropper-modal').style.display='none'">ยกเลิก</button>
    </div>
  </div>

  <!-- โหลดสคริปต์ Cropper.js สำหรับระบบครอปรูป -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updatePassword, sendPasswordResetEmail, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA16VXbSopR3NTBMD-SU-RCgJV5zLPkkBU",
      authDomain: "jokjing-shop.firebaseapp.com",
      projectId: "jokjing-shop",
      storageBucket: "jokjing-shop.firebasestorage.app",
      messagingSenderId: "559683140548",
      appId: "1:559683140548:web:f540aa77108c5a171cc291"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUserData = null;
    let isSignUpMode = false;
    let autoSaveTimer = null;
    let currentRawPassword = "";
    let cropper = null;

    const authModal = document.getElementById("auth-modal");
    const profileModal = document.getElementById("profile-modal");
    const cropperModal = document.getElementById("cropper-modal");
    const sideDrawer = document.getElementById("side-drawer");
    const menuOverlay = document.getElementById("menu-overlay");

    document.getElementById("open-drawer-btn").addEventListener("click", () => { sideDrawer.classList.add("open"); menuOverlay.classList.add("open"); });
    window.closeDrawer = () => { sideDrawer.classList.remove("open"); menuOverlay.classList.remove("open"); };
    menuOverlay.addEventListener("click", closeDrawer);

    document.getElementById("auth-modal-close").addEventListener("click", () => authModal.style.display = "none");

    document.getElementById("floating-profile-btn").addEventListener("click", () => {
      if (auth.currentUser) {
        openProfileModal();
      } else {
        authModal.style.display = "flex";
      }
    });

    onAuthStateChanged(auth, async (user) => {
      const floatBtn = document.getElementById("floating-profile-btn");
      if (user) {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists()) {
          currentUserData = userDoc.data();
          if (currentUserData.avatar) {
            floatBtn.innerHTML = `<img src="${currentUserData.avatar}" alt="Avatar">`;
          } else {
            floatBtn.textContent = (currentUserData.username || "👤").charAt(0);
          }
          if (currentUserData.role === "admin") {
            document.getElementById("admin-menu-link").style.display = "block";
          }
        }
      } else {
        currentUserData = null;
        floatBtn.textContent = "👤";
        document.getElementById("admin-menu-link").style.display = "none";
      }
    });

    // ระบบเลือกรูปภาพและเปิดหน้าต่างครอปอิสระ
    document.getElementById("edit-avatar-file").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const imgElem = document.getElementById("image-to-crop");
          imgElem.src = event.target.result;
          cropperModal.style.display = "flex";

          if (cropper) { cropper.destroy(); }
          // สร้างเครื่องมือครอปแบบอิสระ (สัดส่วน 1:1 เป็นกรอบสี่เหลี่ยมปรับเลื่อนได้)
          cropper = new Cropper(imgElem, {
            aspectRatio: 1,
            viewMode: 1,
            autoCropArea: 0.8,
          });
        };
        reader.readAsDataURL(file);
      }
    });

    // เมื่อกด "ยืนยันการครอปรูป"
    document.getElementById("crop-confirm-btn").addEventListener("click", async () => {
      if (!cropper) return;
      const canvas = cropper.getCroppedCanvas({ width: 300, height: 300 });
      const croppedBase64 = canvas.toDataURL("image/jpeg", 0.85);

      document.getElementById("avatar-preview-img").src = croppedBase64;
      document.getElementById("avatar-preview-img").style.display = "block";
      document.getElementById("avatar-placeholder-txt").style.display = "none";
      cropperModal.style.display = "none";

      // บันทึกรูปลง Firestore อัตโนมัติทันที
      if (auth.currentUser) {
        await updateDoc(doc(db, "users", auth.currentUser.uid), { avatar: croppedBase64 });
        triggerAutoSaveNotice("บันทึกรูปโปรไฟล์เรียบร้อย!");
        document.getElementById("floating-profile-btn").innerHTML = `<img src="${croppedBase64}" alt="Avatar">`;
      }
    });

    function openProfileModal() {
      if (!currentUserData) return;
      
      document.getElementById("profile-username-input").value = currentUserData.username || "";
      document.getElementById("profile-password-display").value = currentRawPassword || "••••••••";
      document.getElementById("profile-password-display").type = "password";
      document.getElementById("toggle-eye-btn").textContent = "👁️";

      const badgeBox = document.getElementById("user-role-badge-container");
      const role = currentUserData.role || "customer";
      let rText = "👤 ลูกค้าทั่วไป", rClass = "role-customer";
      if (role === "admin") { rText = "👑 แอดมินเจ้าของร้าน"; rClass = "role-admin"; }
      else if (role === "agent") { rText = "🌟 ตัวแทนจำหน่าย (Agent)"; rClass = "role-agent"; }
      badgeBox.innerHTML = `<span class="role-badge ${rClass}">สิทธิ์บัญชี: ${rText}</span>`;

      const prevImg = document.getElementById("avatar-preview-img");
      const placeholderTxt = document.getElementById("avatar-placeholder-txt");
      if (currentUserData.avatar) {
        prevImg.src = currentUserData.avatar;
        prevImg.style.display = "block";
        placeholderTxt.style.display = "none";
      } else {
        prevImg.style.display = "none";
        placeholderTxt.style.display = "block";
      }

      profileModal.style.display = "flex";
    }

    window.togglePassView = function() {
      const passInput = document.getElementById("profile-password-display");
      const eyeBtn = document.getElementById("toggle-eye-btn");
      if (passInput.type === "password") {
        passInput.type = "text";
        eyeBtn.textContent = "🙈";
      } else {
        passInput.type = "password";
        eyeBtn.textContent = "👁️";
      }
    };

    document.getElementById("profile-username-input").addEventListener("input", (e) => {
      clearTimeout(autoSaveTimer);
      const newName = e.target.value.trim();
      if (newName.length < 5) return;

      autoSaveTimer = setTimeout(async () => {
        if (auth.currentUser) {
          await updateDoc(doc(db, "users", auth.currentUser.uid), { username: newName });
          currentUserData.username = newName;
          triggerAutoSaveNotice("บันทึกชื่อผู้ใช้ให้อัตโนมัติแล้ว!");
        }
      }, 800);
    });

    function triggerAutoSaveNotice(msg) {
      const box = document.getElementById("auto-save-status");
      box.textContent = "✓ " + msg;
      setTimeout(() => { box.textContent = ""; }, 2500);
    }

    window.togglePassCollapsible = function() {
      const box = document.getElementById("pass-collapsible-box");
      const arrow = document.getElementById("pass-arrow");
      if (box.style.display === "block") {
        box.style.display = "none";
        arrow.textContent = "▼";
      } else {
        box.style.display = "block";
        arrow.textContent = "▲";
      }
    };

    document.getElementById("change-pass-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const newPass = document.getElementById("new-password-input").value;
      if (newPass.length < 4) { alert("รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร"); return; }
      try {
        await updatePassword(auth.currentUser, newPass);
        currentRawPassword = newPass;
        document.getElementById("profile-password-display").value = newPass;
        alert("เปลี่ยนรหัสผ่านสำเร็จ!");
        document.getElementById("new-password-input").value = "";
        togglePassCollapsible();
      } catch (err) { alert("ผิดพลาด: " + err.message); }
    });

    window.logoutUser = async function() {
      await signOut(auth);
      profileModal.style.display = "none";
      alert("ออกจากระบบเรียบร้อยแล้ว");
      location.reload();
    };

    window.forgotPassword = async function() {
      const usernameInput = document.getElementById("auth-username").value.trim();
      if (!usernameInput) { alert("กรุณากรอกชื่อผู้ใช้ในช่องด้านบนก่อนกดลืมรหัสผ่าน"); return; }
      try {
        const email = `${encodeURIComponent(usernameInput).toLowerCase()}@jokjing.shop`;
        await sendPasswordResetEmail(auth, email);
        alert(`ระบบได้ส่งลิงก์กู้คืนรหัสผ่านไปยังอีเมลเชื่อมต่อของ ${usernameInput} เรียบร้อยแล้ว!`);
      } catch (err) { alert("ไม่พบชื่อผู้ใช้นี้ในระบบ"); }
    };

    document.getElementById("switch-mode-btn").addEventListener("click", () => {
      isSignUpMode = !isSignUpMode;
      document.getElementById("modal-title").textContent = isSignUpMode ? "สมัครสมาชิก" : "เข้าสู่ระบบ";
      document.getElementById("modal-submit-btn").textContent = isSignUpMode ? "ยืนยันสมัครสมาชิก" : "เข้าสู่ระบบ";
      document.getElementById("switch-mode-btn").textContent = isSignUpMode ? "มีบัญชีอยู่แล้ว? เข้าสู่ระบบ" : "ยังไม่มีบัญชี? สมัครสมาชิก";
      document.getElementById("forgot-pass-btn").style.display = isSignUpMode ? "none" : "inline-flex";
    });

    document.getElementById("auth-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("auth-username").value.trim();
      const pass = document.getElementById("auth-password").value;

      if (username.length < 5) { alert("ชื่อผู้ใช้ต้องมีอย่างน้อย 5 ตัวอักษร"); return; }
      if (pass.length < 4) { alert("รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร"); return; }

      const email = `${encodeURIComponent(username).toLowerCase()}@jokjing.shop`;

      try {
        if (isSignUpMode) {
          const cred = await createUserWithEmailAndPassword(auth, email, pass);
          await setDoc(doc(db, "users", cred.user.uid), { username: username, role: "customer", createdAt: new Date() });
          currentRawPassword = pass;
          alert("สมัครสมาชิกสำเร็จ!");
        } else {
          await signInWithEmailAndPassword(auth, email, pass);
          currentRawPassword = pass;
          alert("เข้าสู่ระบบสำเร็จ!");
        }
        authModal.style.display = "none";
      } catch (err) { alert("เกิดข้อผิดพลาด: ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง"); }
    });
  </script>
</body>
</html>
